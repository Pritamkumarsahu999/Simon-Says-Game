<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="manipu.css">
    <title>DOM Manipulation</title>
</head>

<body>
    <h1><i><b>Simon Says Game</b></i></h1>
    <h4>Press any key to Start</h4>
    <h3></h3>
    <div class="container">
        <div class="line">
            <div class="red btn" type="button red" id="red"></div>
            <div class="yellow btn" type="button yellow" id="yellow"></div>
        </div>
        <div class="line">
            <div class="green btn" type="button green" id="green"></div>
            <div class="purple btn" type="button purple" id="purple"></div>
        </div>
    </div>
    <script src="manipu.js"></script>
</body>

</html>
</manipu>
